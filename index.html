<!DOCTYPE html>
<html>
<head>
<title>AI Chat App</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

#characters {
  display: flex;
  gap: 10px;
  padding: 10px;
  overflow-x: auto;
  background: #020617;
}

.card {
  background: #1e293b;
  padding: 10px;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

#chat {
  height: 65vh;
  overflow-y: auto;
  padding: 10px;
}

.msg {
  margin: 8px 0;
  opacity: 0;
  animation: fade 0.4s forwards;
}

@keyframes fade {
  to { opacity: 1; }
}

.user { color: #38bdf8; }
.bot { color: #f472b6; }

#inputArea {
  display: flex;
  padding: 10px;
}

input {
  flex: 1;
  padding: 10px;
}

button {
  padding: 10px;
  background: #22c55e;
  border: none;
  color: white;
}
</style>
</head>

<body>

<div id="characters"></div>

<div id="chat"></div>

<div id="inputArea">
  <input id="input" placeholder="Type..." />
  <button onclick="send()">Send</button>
</div>

<script>
const API_KEY = "PASTE_YOUR_KEY_HERE";

const characters = [
  {
    name: "Levi",
    prompt: "You are Levi Ackerman. Cold, sharp, sarcastic, protective deep down. Speak shortly.",
  },
  {
    name: "Mikasa",
    prompt: "You are Mikasa. Calm, loyal, protective, speaks gently but firmly.",
  },
  {
    name: "Gojo",
    prompt: "You are Gojo. Confident, playful, teasing, powerful.",
  }
];

let currentChar = characters[0];
let messages = [];

function loadCharacters() {
  const container = document.getElementById("characters");
  container.innerHTML = "";

  characters.forEach(c => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerText = c.name;

    div.onclick = () => {
      currentChar = c;
      loadChat();
    };

    container.appendChild(div);
  });
}

function loadChat() {
  const chat = document.getElementById("chat");
  chat.innerHTML = "";

  messages = JSON.parse(localStorage.getItem(currentChar.name)) || [];

  messages.forEach(m => {
    addMessage(m.role === "user" ? "You" : currentChar.name, m.content, m.role);
  });
}

function saveChat() {
  localStorage.setItem(currentChar.name, JSON.stringify(messages));
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value;
  if (!text) return;

  addMessage("You", text, "user");

  messages.push({ role: "user", content: text });

  const res = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + API_KEY
    },
    body: JSON.stringify({
      model: "gpt-4o-mini",
      messages: [
        { role: "system", content: currentChar.prompt },
        ...messages
      ]
    })
  });

  const data = await res.json();
  const reply = data.choices[0].message.content;

  messages.push({ role: "assistant", content: reply });

  addMessage(currentChar.name, reply, "bot");

  saveChat();
  input.value = "";
}

function addMessage(sender, text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = "<b>" + sender + ":</b> " + text;
  document.getElementById("chat").appendChild(div);
}

loadCharacters();
loadChat();
</script>

</body>
</html>
